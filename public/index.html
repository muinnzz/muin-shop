<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muin Shop</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#0f172a] text-white">

<!-- Navbar -->
<header class="bg-[#020617] border-b border-gray-800 sticky top-0 z-50">
  <div class="max-w-6xl mx-auto flex justify-between items-center px-4 py-4">
    <h1 class="text-2xl font-bold text-indigo-400">MUIN SHOP</h1>
    <div class="space-x-4">
      <a href="#produk" class="text-gray-300 hover:text-white">Produk</a>
      <a href="#order" class="text-gray-300 hover:text-white">Order</a>
      <a href="#login" class="bg-indigo-600 px-4 py-2 rounded-xl">Login</a>
    </div>
  </div>
</header>

<!-- Hero -->
<section class="bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-700 py-24 text-center">
  <h2 class="text-4xl font-extrabold mb-4">Panel & Servis Digital</h2>
  <p class="text-indigo-100 max-w-xl mx-auto">Website kedai digital moden untuk jual servis, panel atau produk online dengan mudah.</p>
  <a href="#produk" class="inline-block mt-8 bg-white text-indigo-700 px-8 py-3 rounded-2xl font-semibold shadow">Lihat Senarai Produk</a>
</section>

<!-- Produk Section -->
<section id="produk" class="max-w-6xl mx-auto py-16 px-4">
  <h3 class="text-3xl font-bold text-center mb-10">Senarai Produk</h3>
  <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8" id="produk-list">
    <!-- Produk akan diisi oleh script.js -->
  </div>
</section>

<!-- Order Form -->
<section id="order" class="bg-[#020617] py-20">
  <div class="max-w-xl mx-auto px-4">
    <h3 class="text-3xl font-bold mb-6 text-center">Borang Order</h3>
    <form class="space-y-4" id="orderForm">
      <input type="text" id="name" placeholder="Nama" class="w-full p-3 rounded-xl bg-gray-900 border border-gray-700" required />
      <input type="text" id="wa" placeholder="WhatsApp" class="w-full p-3 rounded-xl bg-gray-900 border border-gray-700" required />
      <select id="product" class="w-full p-3 rounded-xl bg-gray-900 border border-gray-700" required>
        <option value="">Pilih Produk</option>
      </select>
      <textarea id="note" placeholder="Nota tambahan" class="w-full p-3 rounded-xl bg-gray-900 border border-gray-700"></textarea>
      <button type="submit" class="w-full bg-indigo-600 py-3 rounded-xl">Hantar Order</button>
    </form>
  </div>
</section>

<!-- Login Admin -->
<section id="login" class="py-20">
  <div class="max-w-md mx-auto bg-[#020617] border border-gray-800 rounded-2xl p-8">
    <h3 class="text-2xl font-bold mb-6 text-center">Login Admin</h3>
    <form id="loginForm" class="space-y-4">
      <input type="text" id="username" placeholder="Username" class="w-full p-3 rounded-xl bg-gray-900 border border-gray-700" required />
      <input type="password" id="password" placeholder="Password" class="w-full p-3 rounded-xl bg-gray-900 border border-gray-700" required />
      <button type="submit" class="w-full bg-indigo-600 py-3 rounded-xl">Login</button>
    </form>
  </div>
</section>

<!-- Admin Chart -->
<section id="admin-chart" class="py-20 hidden">
  <div class="max-w-3xl mx-auto bg-[#020617] p-6 rounded-2xl">
    <h3 class="text-2xl font-bold mb-6 text-center">Statistik Jualan</h3>
    <canvas id="salesChart"></canvas>
  </div>
</section>

<footer class="bg-black text-gray-500 text-center py-4">© 2026 Muin Shop</footer>

<script src="script.js"></script>
</body>
</html>
