<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muin Shop - Tema Kuning Zenitsu</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="font-poppins">

<!-- Navbar -->
<header>
  <div class="max-w-6xl mx-auto flex justify-between items-center px-4 py-4">
    <h1>MUIN SHOP</h1>
    <div class="space-x-4">
      <a href="#produk">Produk</a>
      <a href="#order">Order</a>
      <a href="#login">Login</a>
    </div>
  </div>
</header>

<!-- Hero Banner -->
<section class="hero-section">
  <div class="hero-banner"></div>
  <h2>Panel & Servis Digital</h2>
  <p>Website kedai digital moden untuk jual servis, panel atau produk online dengan mudah.</p>
  <a href="#produk" class="neon-button">Lihat Senarai Produk</a>
</section>

<!-- Produk Section -->
<section id="produk">
  <h3>Senarai Produk</h3>
  <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8" id="produk-list"></div>
</section>

<!-- Order Form -->
<section id="order">
  <div class="max-w-xl mx-auto">
    <h3>Borang Order</h3>
    <form id="orderForm">
      <input type="text" id="name" placeholder="Nama" required />
      <input type="text" id="wa" placeholder="WhatsApp" required />
      <select id="product" required>
        <option value="">Pilih Produk</option>
      </select>
      <textarea id="note" placeholder="Nota tambahan"></textarea>
      <button type="submit" class="neon-button">Hantar Order</button>
    </form>
  </div>
</section>

<!-- Login Admin -->
<section id="login">
  <div class="max-w-md mx-auto">
    <h3>Login Admin</h3>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit" class="neon-button">Login</button>
    </form>
  </div>
</section>

<!-- Admin Chart -->
<section id="admin-chart" class="hidden">
  <div class="max-w-3xl mx-auto">
    <h3>Statistik Jualan</h3>
    <canvas id="salesChart"></canvas>
  </div>
</section>

<!-- Toast Notification -->
<div id="toast"></div>

<footer>
  © 2026 Muin Shop
</footer>

<script src="script.js"></script>
</body>
</html>
