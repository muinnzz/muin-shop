<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Muin Shop</title>

<link rel="stylesheet" href="/public/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial, Helvetica, sans-serif;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:#020617;
  border:1px solid #1f2937;
  border-radius:16px;
  padding:20px;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-bottom:20px;
}

.stat-box{
  background:#020617;
  border:1px solid #1f2937;
  border-radius:16px;
  padding:20px;
  text-align:center;
}

.stat-box h2{
  font-size:28px;
  margin:10px 0;
  color:#6366f1;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th, .table td{
  padding:12px;
  border-bottom:1px solid #1f2937;
}

.btn{
  background:#6366f1;
  border:none;
  padding:8px 14px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

.btn:hover{
  background:#4f46e5;
}

</style>
</head>

<body>

<div class="container">

<h1 style="margin-bottom:20px;">📊 Dashboard Admin Muin Shop</h1>

<!-- Statistik -->
<div class="stats">
  <div class="stat-box">
    <p>Total Order</p>
    <h2 id="totalOrder">0</h2>
  </div>

  <div class="stat-box">
    <p>Jumlah Jualan (RM)</p>
    <h2 id="totalSales">0</h2>
  </div>

  <div class="stat-box">
    <p>Order Pending</p>
    <h2 id="pendingOrder">0</h2>
  </div>
</div>

<!-- Grafik -->
<div class="card" style="margin-bottom:20px;">
  <h3>Grafik Jualan</h3>
  <canvas id="salesChart"></canvas>
</div>

<!-- Tabel Order -->
<div class="card">
  <h3>Senarai Order</h3>

  <table class="table">
    <thead>
      <tr>
        <th>Nama</th>
        <th>WhatsApp</th>
        <th>Produk</th>
        <th>Status</th>
        <th>Tindakan</th>
      </tr>
    </thead>

    <tbody id="orderTable"></tbody>
  </table>
</div>

</div>

<script>
async function loadDashboard(){

  const res = await fetch('/admin/stats');
  const stats = await res.json();

  document.getElementById('totalOrder').innerText = stats.totalOrder;
  document.getElementById('totalSales').innerText = stats.totalSales;
  document.getElementById('pendingOrder').innerText = stats.pending;

  // chart
  const ctx = document.getElementById('salesChart');

  new Chart(ctx,{
    type:'bar',
    data:{
      labels:stats.labels,
      datasets:[{
        label:'Jualan',
        data:stats.data
      }]
    }
  });

  // orders
  const orderRes = await fetch('/admin/orders');
  const orders = await orderRes.json();

  const table = document.getElementById('orderTable');
  table.innerHTML='';

  orders.forEach(o=>{
    table.innerHTML += `
      <tr>
        <td>${o.name}</td>
        <td>${o.whatsapp}</td>
        <td>${o.product}</td>
        <td>${o.status}</td>
        <td>
          <button class="btn" onclick="verify(${o.id})">Verify</button>
        </td>
      </tr>
    `;
  });
}

async function verify(id){
  await fetch('/admin/verify/'+id,{method:'POST'});
  alert('Payment verified');
  loadDashboard();
}

loadDashboard();
</script>

</body>
</html>
